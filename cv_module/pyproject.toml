[project]
name = "interview-cv"
version = "0.1.0"
description = "Computer-vision analysis module for the AI mock interview platform (face, expression, gaze, posture)."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
dependencies = [
    "mediapipe>=0.10.14",
    "onnxruntime>=1.17",
    "opencv-python>=4.9",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
interview-cv = "interview_cv.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: needs downloaded model files (and sample media); skipped automatically when absent",
]
filterwarnings = ["ignore::DeprecationWarning"]
